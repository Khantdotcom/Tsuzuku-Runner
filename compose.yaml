name: tsuzuku

# Local development stack. `docker compose up --build` runs Postgres, applies
# migrations, then starts the API, two workers, and the dashboard.
# `docker compose up -d postgres` starts only the database for host-side work.

x-go-build: &go-build
  context: .
  dockerfile: Dockerfile

x-common-env: &common-env
  TSUZUKU_ENV: development
  TSUZUKU_LOG_LEVEL: ${TSUZUKU_LOG_LEVEL:-info}

x-database-url: &database-url postgres://tsuzuku:tsuzuku@postgres:5432/tsuzuku?sslmode=disable

x-worker: &worker
  build:
    <<: *go-build
    target: worker
  depends_on:
    server:
      condition: service_started
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tsuzuku
      POSTGRES_PASSWORD: tsuzuku
      POSTGRES_DB: tsuzuku
    ports:
      # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432.
      - "127.0.0.1:${TSUZUKU_PG_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsuzuku -d tsuzuku"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build:
      <<: *go-build
      target: migrate
    environment:
      <<: *common-env
      TSUZUKU_DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      <<: *go-build
      target: server
    environment:
      <<: *common-env
      TSUZUKU_DATABASE_URL: *database-url
      TSUZUKU_WORKER_TOKEN: ${TSUZUKU_WORKER_TOKEN:-dev-worker-token}
    ports:
      - "127.0.0.1:${TSUZUKU_API_HOST_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker-01:
    <<: *worker
    hostname: worker-01
    environment:
      <<: *common-env
      TSUZUKU_API_URL: http://server:8080
      TSUZUKU_WORKER_TOKEN: ${TSUZUKU_WORKER_TOKEN:-dev-worker-token}
      TSUZUKU_WORKER_NAME: worker-01
      TSUZUKU_WORKER_SLOTS: 2

  worker-02:
    <<: *worker
    hostname: worker-02
    environment:
      <<: *common-env
      TSUZUKU_API_URL: http://server:8080
      TSUZUKU_WORKER_TOKEN: ${TSUZUKU_WORKER_TOKEN:-dev-worker-token}
      TSUZUKU_WORKER_NAME: worker-02
      TSUZUKU_WORKER_SLOTS: 2

  frontend:
    build:
      context: ./frontend
    environment:
      TSUZUKU_API_URL: http://server:8080
    ports:
      - "127.0.0.1:${TSUZUKU_UI_HOST_PORT:-3000}:3000"
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
