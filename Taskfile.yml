version: "3"

dotenv: [".env"]

vars:
  BIN_DIR: bin
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  # Keep these images in sync with .github/workflows/ci.yml.
  SQLC_IMAGE: sqlc/sqlc:1.31.1
  GO_IMAGE: golang:1.27
  NODE_IMAGE: node:24
  GOLANGCI_LINT_IMAGE: golangci/golangci-lint:v2.14.0
  SMOKE_IMAGE: alpine:3
  SMOKE_PROJECT: tsuzuku-smoke
  # Shared by the *:docker tasks. Named volumes keep caches between runs and keep
  # Linux node_modules out of the host checkout.
  DOCKER_GO: >-
    docker run --rm -v "{{.ROOT_DIR}}:/src" -w /src
    -v tsuzuku-gomod:/go/pkg/mod -v tsuzuku-gocache:/root/.cache/go-build

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build server, worker, and migrate binaries into ./bin
    cmds:
      - go build -o {{.BIN_DIR}}/server{{.EXE}} ./cmd/server
      - go build -o {{.BIN_DIR}}/worker{{.EXE}} ./cmd/worker
      - go build -o {{.BIN_DIR}}/migrate{{.EXE}} ./cmd/migrate

  run:server:
    desc: Run the API server
    cmds:
      - go run ./cmd/server

  run:worker:
    desc: Run a worker
    cmds:
      - go run ./cmd/worker

  up:
    desc: Build and start the full stack (Postgres, migrations, server, two workers, dashboard)
    cmds:
      - docker compose up --build -d

  down:
    desc: Stop and remove the stack containers (database volume is kept)
    cmds:
      - docker compose down

  logs:
    desc: "Follow stack logs (usage: task logs -- server worker-01)"
    cmds:
      - docker compose logs -f {{.CLI_ARGS}}

  fe:install:
    desc: Install dashboard dependencies
    cmds:
      - pnpm --dir frontend install

  fe:dev:
    desc: Run the dashboard with hot reload on http://localhost:3000 (proxies to TSUZUKU_API_URL)
    cmds:
      - pnpm --dir frontend dev

  fe:lint:
    desc: Lint the dashboard
    cmds:
      - pnpm --dir frontend lint

  fe:typecheck:
    desc: Type-check the dashboard
    cmds:
      - pnpm --dir frontend typecheck

  fe:build:
    desc: Build the dashboard for production
    cmds:
      - pnpm --dir frontend build

  db:up:
    desc: Start the development PostgreSQL container and wait until it is healthy
    cmds:
      - docker compose up -d --wait postgres

  db:down:
    desc: Stop the development PostgreSQL container (data is kept)
    cmds:
      - docker compose stop postgres

  db:reset:
    desc: Delete the development database volume and start fresh
    cmds:
      - docker compose down -v
      - task: db:up

  db:psql:
    desc: Open psql in the development PostgreSQL container
    interactive: true
    cmds:
      - docker compose exec postgres psql -U tsuzuku -d tsuzuku

  migrate:up:
    desc: Apply all pending migrations
    cmds:
      - go run ./cmd/migrate up

  migrate:down:
    desc: Roll back the most recent migration
    cmds:
      - go run ./cmd/migrate down

  migrate:status:
    desc: Show which migrations are applied
    cmds:
      - go run ./cmd/migrate status

  migrate:create:
    desc: "Create a new SQL migration (usage: task migrate:create -- add_column_x)"
    cmds:
      - go run ./cmd/migrate create {{.CLI_ARGS}}

  seed:
    desc: Load example data into the development database
    cmds:
      - go run ./cmd/seed

  sqlc:
    desc: Regenerate type-safe query code with sqlc (runs in Docker)
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/src" -w /src {{.SQLC_IMAGE}} generate

  sqlc:check:
    desc: Fail if generated query code is out of date
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/src" -w /src {{.SQLC_IMAGE}} diff

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  test:integration:
    desc: Run integration tests against disposable PostgreSQL containers (requires Docker)
    cmds:
      - go test -tags integration -count=1 ./...

  test:race:
    desc: Run unit tests with the race detector (requires cgo)
    env:
      CGO_ENABLED: "1"
    cmds:
      - go test -race ./...

  ci:
    desc: Run the CI checks locally (Go tidy, vet, lint, tests; sqlc drift; dashboard lint, typecheck, build)
    cmds:
      - go mod tidy -diff
      - go vet -tags integration ./...
      - task: lint
      - task: test:integration
      - task: sqlc:check
      - task: fe:lint
      - task: fe:typecheck
      - task: fe:build

  test:docker:
    desc: "Run unit and integration tests with the race detector in a Linux container (needs only Docker; extra go test flags: task test:docker -- -run X)"
    cmds:
      - >-
        {{.DOCKER_GO}}
        -v /var/run/docker.sock:/var/run/docker.sock
        --add-host=host.docker.internal:host-gateway
        -e TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal
        {{.GO_IMAGE}} go test -race -count=1 -tags integration {{.CLI_ARGS}} ./...

  lint:docker:
    desc: Run golangci-lint in a container (same version as CI)
    cmds:
      - >-
        {{.DOCKER_GO}}
        -v tsuzuku-golangci-cache:/root/.cache/golangci-lint
        {{.GOLANGCI_LINT_IMAGE}} golangci-lint run

  fe:docker:
    desc: Install, lint, type-check, and build the dashboard in a container (needs only Docker)
    cmds:
      - >-
        docker run --rm -v "{{.ROOT_DIR}}:/src" -w /src/frontend
        -v tsuzuku-fe-node-modules:/src/frontend/node_modules
        -v tsuzuku-pnpm-store:/pnpm-store
        -v tsuzuku-corepack:/root/.cache/node/corepack
        -e CI=true -e NEXT_TELEMETRY_DISABLED=1 -e COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        {{.NODE_IMAGE}} sh -c "corepack enable
        && pnpm install --frozen-lockfile --store-dir /pnpm-store
        && pnpm lint && pnpm typecheck && pnpm build"

  ci:docker:
    desc: Run the CI checks with only Docker installed (Go tidy, vet, lint, race and integration tests; sqlc drift; dashboard)
    cmds:
      - '{{.DOCKER_GO}} {{.GO_IMAGE}} sh -c "go mod tidy -diff && go vet -tags integration ./..."'
      - task: lint:docker
      - task: test:docker
      - task: sqlc:check
      - task: fe:docker

  smoke:
    desc: Build the stack as a separate Compose project, wait for /readyz and two online workers, run a passing and a failing job end to end, then remove it (dev stack and data untouched)
    env:
      TSUZUKU_PG_HOST_PORT: "15433"
      TSUZUKU_API_HOST_PORT: "18080"
      TSUZUKU_UI_HOST_PORT: "13000"
    cmds:
      - defer: docker compose -p {{.SMOKE_PROJECT}} down --volumes --remove-orphans
      - defer: '{{if .EXIT_CODE}}docker compose -p {{.SMOKE_PROJECT}} logs --no-color{{else}}true{{end}}'
      - docker compose -p {{.SMOKE_PROJECT}} up --build --detach
      - >-
        docker run --rm --network {{.SMOKE_PROJECT}}_default
        -v "{{.ROOT_DIR}}/scripts:/scripts:ro"
        {{.SMOKE_IMAGE}} sh /scripts/smoke-probe.sh

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  fmt:
    desc: Format Go code with golangci-lint formatters
    cmds:
      - golangci-lint fmt

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy
