version: "3"

dotenv: [".env"]

vars:
  BIN_DIR: bin
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  SQLC_IMAGE: sqlc/sqlc:1.31.1

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build server, worker, and migrate binaries into ./bin
    cmds:
      - go build -o {{.BIN_DIR}}/server{{.EXE}} ./cmd/server
      - go build -o {{.BIN_DIR}}/worker{{.EXE}} ./cmd/worker
      - go build -o {{.BIN_DIR}}/migrate{{.EXE}} ./cmd/migrate

  run:server:
    desc: Run the API server
    cmds:
      - go run ./cmd/server

  run:worker:
    desc: Run a worker
    cmds:
      - go run ./cmd/worker

  up:
    desc: Build and start the full stack (Postgres, migrations, server, two workers, dashboard)
    cmds:
      - docker compose up --build -d

  down:
    desc: Stop and remove the stack containers (database volume is kept)
    cmds:
      - docker compose down

  logs:
    desc: "Follow stack logs (usage: task logs -- server worker-01)"
    cmds:
      - docker compose logs -f {{.CLI_ARGS}}

  fe:install:
    desc: Install dashboard dependencies
    cmds:
      - pnpm --dir frontend install

  fe:dev:
    desc: Run the dashboard with hot reload on http://localhost:3000 (proxies to TSUZUKU_API_URL)
    cmds:
      - pnpm --dir frontend dev

  fe:lint:
    desc: Lint the dashboard
    cmds:
      - pnpm --dir frontend lint

  fe:typecheck:
    desc: Type-check the dashboard
    cmds:
      - pnpm --dir frontend typecheck

  fe:build:
    desc: Build the dashboard for production
    cmds:
      - pnpm --dir frontend build

  db:up:
    desc: Start the development PostgreSQL container and wait until it is healthy
    cmds:
      - docker compose up -d --wait postgres

  db:down:
    desc: Stop the development PostgreSQL container (data is kept)
    cmds:
      - docker compose stop postgres

  db:reset:
    desc: Delete the development database volume and start fresh
    cmds:
      - docker compose down -v
      - task: db:up

  db:psql:
    desc: Open psql in the development PostgreSQL container
    interactive: true
    cmds:
      - docker compose exec postgres psql -U tsuzuku -d tsuzuku

  migrate:up:
    desc: Apply all pending migrations
    cmds:
      - go run ./cmd/migrate up

  migrate:down:
    desc: Roll back the most recent migration
    cmds:
      - go run ./cmd/migrate down

  migrate:status:
    desc: Show which migrations are applied
    cmds:
      - go run ./cmd/migrate status

  migrate:create:
    desc: "Create a new SQL migration (usage: task migrate:create -- add_column_x)"
    cmds:
      - go run ./cmd/migrate create {{.CLI_ARGS}}

  seed:
    desc: Load example data into the development database
    cmds:
      - go run ./cmd/seed

  sqlc:
    desc: Regenerate type-safe query code with sqlc (runs in Docker)
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/src" -w /src {{.SQLC_IMAGE}} generate

  sqlc:check:
    desc: Fail if generated query code is out of date
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/src" -w /src {{.SQLC_IMAGE}} diff

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  test:integration:
    desc: Run integration tests against disposable PostgreSQL containers (requires Docker)
    cmds:
      - go test -tags integration -count=1 ./...

  test:race:
    desc: Run unit tests with the race detector (requires cgo)
    env:
      CGO_ENABLED: "1"
    cmds:
      - go test -race ./...

  ci:
    desc: Run the CI checks locally (Go tidy, vet, lint, tests; sqlc drift; dashboard lint, typecheck, build)
    cmds:
      - go mod tidy -diff
      - go vet -tags integration ./...
      - task: lint
      - task: test:integration
      - task: sqlc:check
      - task: fe:lint
      - task: fe:typecheck
      - task: fe:build

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  fmt:
    desc: Format Go code with golangci-lint formatters
    cmds:
      - golangci-lint fmt

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy
